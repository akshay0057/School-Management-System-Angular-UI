<div class="container py-4">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow border-0 profile-card">

                <div class="card-body">

                    <div class="text-center">

                        <div class="avatar">

                            {{profile?.name?.charAt(0)}}

                        </div>

                        <h3 class="mt-3">

                            {{profile?.name}}

                        </h3>

                        <p class="text-muted">

                            School Management System User

                        </p>

                    </div>

                    <hr>

                    <div class="profile-item">

                        <label>User Id</label>

                        <div>

                            {{profile?.id}}

                        </div>

                    </div>

                    <div class="profile-item">

                        <label>Name</label>

                        <div>

                            {{profile?.name}}

                        </div>

                    </div>

                    <div class="profile-item">

                        <label>Email</label>

                        <div>

                            {{profile?.email}}

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
