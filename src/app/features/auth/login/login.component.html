<div class="login-container">

    <div class="login-card">

        <div class="text-center mb-4">

            <h2>School Management App</h2>

            <p class="text-muted">
                Sign in to continue
            </p>

        </div>

        <form
            [formGroup]="loginForm"
            (ngSubmit)="login()">

            <!-- Username -->

            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    class="form-control"
                    placeholder="Enter your username"
                    formControlName="userName">

            </div>

            <!-- Password -->

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    class="form-control"
                    placeholder="Enter your password"
                    formControlName="password">

            </div>

            <!-- Login Button -->

            <button
                type="submit"
                class="btn btn-primary w-100">

                Login

            </button>

        </form>

    </div>

</div>
